name: Build .NET MAUI APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Sqrt_cal_1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Decode Keystore
        shell: bash
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > android-release.keystore

      - name: Publish signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          dotnet publish -f net10.0-android -c Release
          -p:AndroidPackageFormat=apk
          -p:JavaSdkDirectory="$JAVA_HOME"
          -p:JavaMaxHeapSize=2G
          -p:RunAOTCompilation=false
          -p:AndroidEnableProfiledAot=false
          -p:AndroidSigningKeyStore=android-release.keystore
          -p:AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD"
          -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
          -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAUI-Android-APK
          path: Sqrt_cal_1/bin/Release/net10.0-android/publish/*.apk
          if-no-files-found: error
